name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on:
      - self-hosted
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify Dalamud install
        shell: pwsh
        run: |
          if (-not $env:APPDATA) {
            throw "APPDATA is not set on the runner."
          }

          $dalamudPath = Join-Path $env:APPDATA "XIVLauncher\\addon\\Hooks\\dev"
          if (-not (Test-Path $dalamudPath)) {
            throw "Dalamud dev path not found at $dalamudPath. Use a self-hosted Windows runner with XIVLauncher/Dalamud installed, or set DALAMUD_HOME to a valid Dalamud dev directory."
          }

      - name: Build Release
        run: dotnet build Tsunippy.sln -c Release -clp:ErrorsOnly

      - name: Verify packaged zip
        shell: pwsh
        run: |
          if (-not (Test-Path "bin/Release/Tsunippy/latest.zip")) {
            throw "Expected release asset bin/Release/Tsunippy/latest.zip was not produced."
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/Tsunippy/latest.zip
          generate_release_notes: true
